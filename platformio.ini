[env:waveshare-amoled-216]
; Ověřeno s platformou 8.0.0 (Arduino core 3.3.12). Kód potřebuje Arduino core 3.x
; (ESP_I2S, NimBLE), proto je verze zafixovaná proti nečekanému velkému skoku.
platform = espressif32 @ ~8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
